<html lang="en">
<head>

    <style>
        /* ─────────── RESET & BASE ─────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #243447;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #e50914;
            --accent-hover: #f6121d;
            --border: #2d3a4f;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.3s ease;
            --success: #22c55e;
            --warning: #eab308;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-hover);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;

        /* ─────────── HEADER ─────────── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(17, 24, 39, 0.95);
        }
        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;

        .logo span {

            font-size: 13px;

        .btn-primary:hover {

        .btn-secondary {

        .btn-sm {

        /* ─────────── PAGINATION ─────────── */
        .pagination {

        /* ─────────── MODAL, TOAST, ETC (same as before) ─────────── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--bg-secondary); border-radius: var(--radius); max-width: 900px; width: 100%; max-height: 95vh; overflow-y: auto; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
        .modal-close { position: sticky; top: 10px; right: 10px; float: right; z-index: 10; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .modal-body { padding: 0 24px 28px; }
        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .toast { background: var(--bg-card); color: var(--text-primary); padding: 10px 22px; border-radius: 30px; border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; animation: toastIn 0.3s ease; }
        .toast.error { background: #7f1d1d; border-color: #dc2626; }
        .toast.success { background: #14532d; border-color: var(--success); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <script>

<script>
  const data = JSON.parse(document.getElementById('episodeData').textContent);
  const list = document.getElementById('episodes');

<\/script>`;

        // ═══════════ UTILS ═══════════
        const sleep = (ms) => new Promise(r=>setTimeout(r,ms));

        // ═══════════ TMDB FETCH ═══════════
        async function fetchFromTMDB(endpoint, params={}) {
            const url = new URL(TMDB_BASE+endpoint);
            url.searchParams.set('api_key',TMDB_API_KEY);
            url.searchParams.set('language','en-US');
            Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
            const r = await fetch(url.toString());
            if(!r.ok) throw new Error(`TMDB ${r.status}`);
            return r.json();
        }

        // ═══════════ FETCH ALL EPISODES (TV) ═══════════
        async function fetchTVDetails(tmdbId) {
            const series = await fetchFromTMDB(`/tv/${tmdbId}`);
            const imdbId = series.external_ids?.imdb_id || tmdbId;
            const seasons = series.seasons || [];
            const seasonReqs = seasons.map(s=>fetchFromTMDB(`/tv/${tmdbId}/season/${s.season_number}`));
            const seasonData = await Promise.all(seasonReqs);
            let allEpisodes = [];
            seasonData.forEach(sd=>{
                if(sd.episodes){
                    sd.episodes.forEach(ep=>{
                        allEpisodes.push({
                            season: sd.season_number,
                            ep: ep.episode_number,
                            src: `${VIDSRC_BASE}/${imdbId}/${sd.season_number}/${ep.episode_number}`
                        });
                    });
                }
            });
            return allEpisodes;
        }

        // ═══════════ LOAD CONTENT ═══════════
        async function loadCategory(cat, page=1, query='', media='all', year='') {
            if(isLoading) return;
            isLoading = true;
            currentCategory = cat; currentPage = page; searchQuery = query;
            currentMediaType = media; currentYear = year;
            grid.innerHTML = 'Loading…';

            try {
                let endpoint, params = { page };
                const isTV = (media==='tv' || cat==='tv') && media!=='movie';

                // Determine endpoint based on category and media type
                if(query){
                    if(media==='movie') endpoint='/search/movie';
                    else if(media==='tv') endpoint='/search/tv';
                    else endpoint='/search/multi';
                    params.query = query;
                } else if(year){
                    // year filter overrides category, use discover
                    if(isTV) endpoint='/discover/tv';
                    else endpoint='/discover/movie';
                    if(isTV) params.first_air_date_year = year;
                    else params.primary_release_year = year;
                    params.sort_by = 'popularity.desc';
                } else {
                    const map = {
                        trending: isTV ? '/trending/tv/day' : '/trending/movie/day',
                        now_playing: '/movie/now_playing',
                        top_rated: isTV ? '/tv/top_rated' : '/movie/top_rated',
                        popular: isTV ? '/tv/popular' : '/movie/popular',
                        tv: '/tv/popular',
                        old: '/discover/movie'
                    };
                    endpoint = map[cat] || map.trending;
                    if(cat==='old') params['release_date.lte']='2000-01-01';
                }

                const data = await fetchFromTMDB(endpoint, params);
                totalPages = data.total_pages || 1;
                const items = data.results || [];

                currentMovies = await Promise.all(items.map(async item=>{
                    const type = item.media_type || (isTV?'tv':'movie');
                    let imdbId = null;
                    try { const ids = await fetchFromTMDB(`/${type}/${item.id}/external_ids`); imdbId=ids.imdb_id; }catch(e){}
                    const genreNames = (item.genre_ids||[]).map(id=>GENRE_MAP[id]).filter(Boolean);
                    return {
                        ...item, id: item.id, media_type: type,
                        title: item.title||item.name||'Untitled',
                        year: (item.release_date||item.first_air_date||'').split('-')[0],
                        imdb_id: imdbId, embed_url: imdbId?`${VIDSRC_BASE}/${imdbId}`:null,
                        genre_names: genreNames
                    };
                }));

                selectedMovies.clear();
                renderMovies();
                renderPagination();
                updateSelectionUI();
            } catch(e){ grid.innerHTML = `Error: ${e.message}`; }
            finally { isLoading = false; }
        }

        function renderMovies(){
            if(!currentMovies.length){ grid.innerHTML='<p>No results.</p>'; return; }
            grid.innerHTML = currentMovies.map((m,i)=>`
                <div class="movie-card ${selectedMovies.has(i)?'selected':''}" data-idx="${i}">
                    <div class="checkbox-overlay ${selectedMovies.has(i)?'show':''}">
                        <input type="checkbox" ${selectedMovies.has(i)?'checked':''} />
                    </div>
                    <div class="poster-wrap">
                        ${m.poster_path?`<img src="${TMDB_IMAGE+m.poster_path}" alt="${m.title}" />`:'<div class="placeholder">No Poster</div>'}
                        <div class="badge-top">⭐ ${m.vote_average?.toFixed(1)||'N/A'}</div>
                        <div class="badge-year">${m.year}</div>
                        <div class="badge-embed ${m.imdb_id?'available':'unavailable'}">${m.media_type==='tv'?'📺 TV':'🎬 Movie'}</div>
                    </div>
                    <div class="info">
                        <div class="title">${m.title}</div>
                        <button class="post-btn">Quick Post</button>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.movie-card').forEach(card=>{
                const idx = +card.dataset.idx;
                card.querySelector('.poster-wrap').onclick = ()=>openModal(currentMovies[idx]);
                card.querySelector('.post-btn').onclick = (e)=>{ e.stopPropagation(); postSingle(currentMovies[idx]); };
                card.onclick = (e)=>{
                    if(e.target.closest('.poster-wrap')||e.target.closest('.post-btn')) return;
                    toggleSelect(idx, card);
                };
            });
            syncSelectionToDOM();
        }

        function renderPagination(){
            pageInfo.textContent = `Page ${currentPage} of ${totalPages||1}`;
            prevPageBtn.disabled = currentPage<=1;
            nextPageBtn.disabled = currentPage>=totalPages;
        }

        // ═══════════ SELECTION ═══════════
        function toggleSelect(idx, card){
            if(selectedMovies.has(idx)) selectedMovies.delete(idx);
            else selectedMovies.set(idx, currentMovies[idx]);
            updateSelectionUI();
            syncCardSelection(card, selectedMovies.has(idx));
        }
        function syncCardSelection(card, sel){
            card.classList.toggle('selected',sel);
            card.querySelector('.checkbox-overlay').classList.toggle('show',sel);
            card.querySelector('input').checked = sel;
        }
        function syncSelectionToDOM(){
            grid.querySelectorAll('.movie-card').forEach(c=>{
                const idx = +c.dataset.idx;
                syncCardSelection(c, selectedMovies.has(idx));
            });
        }
        function updateSelectionUI(){
            selectedCount.textContent = `${selectedMovies.size} selected`;
            postSelectedBtn.disabled = !selectedMovies.size;
            selectAllCheckbox.checked = selectedMovies.size===currentMovies.length && currentMovies.length>0;
        }

        selectAllCheckbox.onchange = e=>{
            if(e.target.checked) currentMovies.forEach((m,i)=>selectedMovies.set(i,m));
            else selectedMovies.clear();
            updateSelectionUI(); syncSelectionToDOM();
        };
        deselectAllBtn.onclick = ()=>{ selectedMovies.clear(); updateSelectionUI(); syncSelectionToDOM(); };

        // ═══════════ POSTING ═══════════
        async function postToBlogger(movie){
            if(!accessToken||!currentBlogId) throw new Error('Not signed in');
            let episodes = [];
            if(movie.media_type==='tv' && movie.id){
                try { episodes = await fetchTVDetails(movie.id); } catch(e){ console.warn(e); }
            }
            const title = `${movie.title} (${movie.year||''})`;
            const content = renderTemplate(movie, templateTextarea.value||postTemplate, episodes);

            // labels
            let labels = [movie.media_type==='tv'?'tv':'movie'];
            if(movie.genre_names) movie.genre_names.forEach(g=>labels.push(g.toLowerCase()));
            if(movie.tags) movie.tags.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(t=>{ if(!labels.includes(t)) labels.push(t); });
            labels = [...new Set(labels)];

            const postData = {
                kind: 'blogger#post',
                blog: { id: currentBlogId },
                title, content, labels
            };
            const resp = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${currentBlogId}/posts`,{
                method:'POST', headers:{'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'}, body:JSON.stringify(postData)
            });
            if(!resp.ok){ const err=await resp.json(); throw new Error(err.error?.message); }
            return resp.json();
        }

        async function postSingle(movie){
            if(!accessToken||!currentBlogId){ showToast('Sign in and select blog','error'); return; }
            try{
                showToast(`Posting ${movie.title}...`);
                const res = await postToBlogger(movie);
                addHistory({title:movie.title,date:new Date().toISOString(),status:'success',link:res.url});
                showToast('✅ Posted','success');
            }catch(e){ showToast(e.message,'error'); }
        }

        postSelectedBtn.onclick = async ()=>{
            const movies = [...selectedMovies.values()];
            // ... bulk post logic (as before)
        };

        // ═══════════ EVENT LISTENERS ═══════════
        document.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{
            document.querySelector('.tabs .active').classList.remove('active');
            btn.classList.add('active');
            loadCategory(btn.dataset.cat, 1, searchInput.value, mediaTypeSelect.value, yearInput.value);
        });

        searchBtn.onclick = ()=>loadCategory(currentCategory,1,searchInput.value,mediaTypeSelect.value,yearInput.value);
        clearSearchBtn.onclick = ()=>{ searchInput.value=''; loadCategory(currentCategory,1,'',mediaTypeSelect.value,yearInput.value); };
        prevPageBtn.onclick = ()=>loadCategory(currentCategory,currentPage-1,searchQuery,mediaTypeSelect.value,yearInput.value);
        nextPageBtn.onclick = ()=>loadCategory(currentCategory,currentPage+1,searchQuery,mediaTypeSelect.value,yearInput.value);
        jumpPageBtn.onclick = ()=>{
            const p = parseInt(jumpPageInput.value);
            if(p && p>0 && p<=totalPages) loadCategory(currentCategory,p,searchQuery,mediaTypeSelect.value,yearInput.value);
        };
        mediaTypeSelect.onchange = ()=>loadCategory(currentCategory,1,searchInput.value,mediaTypeSelect.value,yearInput.value);
        yearFilterBtn.onclick = ()=>loadCategory(currentCategory,1,searchInput.value,mediaTypeSelect.value,yearInput.value);

        // initialize
        templateTextarea.value = postTemplate;
        loadCategory('trending');
        // ... OAuth and other init
    </script>
</body>
</html>
